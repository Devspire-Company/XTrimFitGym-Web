# Membership Queries
query GetAllMemberships {
	getMemberships {
		id
		name
		monthlyPrice
		description
		features
		status
		durationType
		monthDuration
		createdAt
		updatedAt
	}
}

query GetActiveMemberships {
	getMemberships(status: ACTIVE) {
		id
		name
		monthlyPrice
		description
		features
		status
		durationType
		monthDuration
		createdAt
		updatedAt
	}
}

query GetCurrentMembership {
	getCurrentMembership {
		id
		clientId
		membershipId
		membership {
			id
			name
			monthlyPrice
			description
			features
			durationType
			monthDuration
		}
		priceAtPurchase
		startedAt
		expiresAt
		status
		createdAt
		updatedAt
	}
}

mutation DirectSubscribeMember($input: DirectSubscribeInput!) {
	directSubscribeMember(input: $input) {
		id
		clientId
		membershipId
		membership {
			id
			name
			monthlyPrice
		}
		priceAtPurchase
		startedAt
		expiresAt
		status
		createdAt
	}
}

# Subscriptions
subscription MembershipsUpdated {
	membershipsUpdated {
		id
		name
		monthlyPrice
		description
		features
		status
		durationType
		monthDuration
		createdAt
		updatedAt
	}
}